services:
  backend:
    image: vedansh52662/driveai-backend:latest
    container_name: driveai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - model_cache:/models
    restart: unless-stopped

  frontend:
    image: vedansh52662/driveai-frontend:latest
    container_name: driveai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_cache:
